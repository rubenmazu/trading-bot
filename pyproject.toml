[project]
name = "qts"
version = "0.1.0"
description = "Quant_Trading_System: sistem determinist de cercetare și trading algoritmic (etapa inițială, fără ordine reale)"
authors = [
    { name = "uih38891", email = "ruben.mazureac@continental-corporation.com" }
]
requires-python = ">=3.13,<3.14"
# Versiuni fixate exact pentru reproductibilitate (Req 17).
dependencies = [
    "keyring==25.7.0",
    "numpy==2.5.3",
    "polars==1.44.2",
    "pydantic==2.13.5",
    "typer==0.27.2",
]

[project.scripts]
qts = "qts.cli:app"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[project.optional-dependencies]
# Adaptor de date Alpaca pentru modul Shadow (feed real, execuție simulată local). Opțional:
# nucleul și testele nu depind de el. Instalează cu `uv sync --extra alpaca`.
alpaca = [
    "alpaca-py==0.44.0",
]

[dependency-groups]
dev = [
    "hypothesis==6.168.5",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "DTZ"]
ignore = ["RUF001", "RUF002", "RUF003"]  # diacritice românești în texte și comentarii

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["keyring.*", "alpaca.*"]
ignore_missing_imports = true
